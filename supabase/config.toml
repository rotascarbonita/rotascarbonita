project_id = "rotas-carbonita"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
enable_signup = false
minimum_password_length = 12

[functions.manage-users]
# O handler valida JWT por auth.getUser, inclusive para as chaves novas.
verify_jwt = false
